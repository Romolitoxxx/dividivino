<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:18px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:radial-gradient(circle at 10% 10%,#FFE3C2 0 60px,transparent 61px),radial-gradient(circle at 92% 18%,#E6DDFF 0 80px,transparent 81px),radial-gradient(circle at 85% 95%,#D6F5E6 0 90px,transparent 91px);background-attachment:fixed}
body.easy{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.04em;font-size:19px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:18px}
#app{max-width:1200px;margin:0 auto;min-height:100%;padding:14px}
h1,h2,h3{margin:.2em 0;line-height:1.15}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.4rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}
.small{font-size:.85em}
.btn{border:none;border-radius:16px;padding:12px 18px;font-weight:700;background:#EFE9FF;color:var(--pri);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5a32d1}
.btn.acc{background:var(--acc);color:#fff;box-shadow:0 4px 0 #d46a22}
.btn.grn{background:var(--grn);color:#fff;box-shadow:0 4px 0 #1f9a61}
.btn.red{background:#FFE4E5;color:var(--red)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--mut)}
.btn.big{font-size:1.35rem;padding:18px 26px;border-radius:22px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 20px rgba(60,40,120,.08)}
.grid{display:grid;gap:14px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.6rem;color:var(--pri)}
.logo svg{width:44px;height:44px}
.av{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:#eee;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:100%;height:100%}
.av .emo{line-height:1}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stu{background:#fff;border:none;border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 #EADFFF;font-weight:800;font-size:1.2rem}

.pill{display:inline-flex;align-items:center;gap:4px;background:#FFF1C9;color:#8a6200;border-radius:99px;padding:3px 12px;font-weight:700}
.prog{height:14px;border-radius:99px;background:#EFE9FF;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),#7BE3B0);border-radius:99px}

.inp{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #E3DAFF;background:#fff}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* modal */

.sheet .g{display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.62);color:#222}

.sheet .hl{border-bottom:3px solid #333;pointer-events:none;margin-bottom:-1px}
.sheet .vl{border-left:3px solid #333;pointer-events:none}

/* tools */

.tools{background:#fff;border-radius:24px 24px 0 0;padding:14px;width:100%;max-width:640px;max-height:88vh;overflow:auto}
@media (min-width:880px) and (orientation:landscape){.tools-bg{align-items:center}.tools{border-radius:24px}}
.ttab{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}
.ttab button{aspect-ratio:1;border:none;border-radius:8px;background:#F4F1FB;font-weight:700;font-size:clamp(12px,3.4vw,19px);padding:0}

.ttab button.on{background:var(--yel);color:var(--ink)}
/* avatar editor */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #E3DAFF}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:64px;height:64px;border-radius:16px;border:2px solid #E3DAFF;background:#fff;padding:4px}
.opt.on{border-color:var(--pri);background:#F1ECFF}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.emogrid button{font-size:2.2rem;height:70px;border-radius:16px;border:2px solid #E3DAFF;background:#fff}
.emogrid button.on{border-color:var(--pri);background:#F1ECFF}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #EADFFF}
.kpi b{display:block;font-size:1.7rem;color:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.bars div{flex:1;background:var(--pri2);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut)}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.hbar .lab{width:200px;font-size:.9em}
.hbar .tr{flex:1;height:14px;background:#F2EEFF;border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--acc)}
table.hist{width:100%;border-collapse:collapse;font-size:.9em}
table.hist td,table.hist th{padding:6px;border-bottom:1px solid #eee;text-align:left}
/* confetti */
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:70;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.mascot{width:90px;height:90px}
.warm-q{font-size:3rem;font-weight:800;text-align:center}
.warm-a{font-size:2.4rem;font-weight:800;text-align:center;min-height:60px;background:#fff;border-radius:18px;padding:4px}
@media print{
  body{background:#fff}
  .noprint,.topbar .btn{display:none!important}
  .card,.kpi{box-shadow:none;border:1px solid #ddd}
}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ================= ENGINE START ================= */
function solveDiv(D, v, method) {
  const ds = String(D).split('').map(Number), n = ds.length;
  let i = 0, p = ds[0];
  while (p < v && i < n - 1) { i++; p = p * 10 + ds[i]; }
  const cells = [], acts = [], qd = [], steps = [];
  const longM = method !== 'italiano';
  let curRow = 0, endCol = i, row = 0;
  while (true) {
    const q = Math.floor(p / v), prod = q * v, r = p - prod, k = qd.length;
    qd.push(q);
    steps.push({ q, prod, r, p, endCol });
    const qid = 'q' + k;
    cells.push({ id: qid, kind: 'q', val: q, area: 'q', c: k, step: k });
    acts.push({ kind: 'q', step: k, ids: [qid] });
    let remRow = curRow, nextVal;
    if (q > 0) {
      if (longM) {
        row++;
        const s = String(prod), ids = [];
        for (let j = 0; j < s.length; j++) {
          const c = endCol - s.length + 1 + j, id = `w${row}_${c}`;
          cells.push({ id, kind: 'prod', val: +s[j], area: 'w', r: row, c, step: k });
          ids.push(id);
        }
        acts.push({ kind: 'prod', step: k, ids, row, c1: endCol - s.length + 1, c2: endCol });
      }
      row++; remRow = row;
      const s = String(r), ids = [];
      for (let j = s.length - 1; j >= 0; j--) {
        const c = endCol - s.length + 1 + j, id = `w${row}_${c}`;
        cells.push({ id, kind: 'rem', val: +s[j], area: 'w', r: row, c, step: k });
        ids.push(id);
      }
      acts.push({ kind: 'rem', step: k, ids });
      nextVal = r;
    } else {
      nextVal = p;
    }
    if (i < n - 1) {
      i++;
      const id = `w${remRow}_${i}`;
      cells.push({ id, kind: 'down', val: ds[i], area: 'w', r: remRow, c: i, step: k });
      acts.push({ kind: 'down', step: k, ids: [id] });
      p = nextVal * 10 + ds[i]; endCol = i; curRow = remRow;
    } else {
      return { D, v, n, ds, qd, Q: Math.floor(D / v), R: D % v, cells, acts, steps, rows: row, method: longM ? 'lungo' : 'italiano' };
    }
  }
}

function buildDivSheet(sol) {
  const n = sol.n, vs = String(sol.v), W = Math.max(vs.length, sol.qd.length) + 1;
  const items = [], hl = [], vl = [], cells = [];
  sol.ds.forEach((d, i) => items.push({ r: 0, c: 1 + i, t: String(d) }));
  vs.split('').forEach((d, j) => items.push({ r: 0, c: n + 1 + j, t: d }));
  hl.push({ r: 0, c1: n + 1, c2: n + W });
  const rows = Math.max(sol.rows, 1);
  vl.push({ c: n + 1, r1: 0, r2: rows });
  for (const a of sol.acts) if (a.kind === 'prod') {
    items.push({ r: a.row, c: a.c1, t: '−' });
    hl.push({ r: a.row, c1: 1 + a.c1, c2: 1 + a.c2 });
  }
  for (const c of sol.cells) {
    if (c.area === 'q') cells.push(Object.assign({}, c, { r: 1, c: n + 1 + c.c }));
    else cells.push(Object.assign({}, c, { c: 1 + c.c }));
  }
  return { cols: n + 1 + W, rows: rows + 1, items, hl, vl, cells, acts: sol.acts };
}

function buildProof(sol) {
  const { Q, v, R, D } = sol, qs = String(Q), vs = String(v), prodStr = String(Q * v);
  const partials = vs.length > 1 ? [String(Q * (v % 10)), String(Q * Math.floor(v / 10))] : null;
  const W = Math.max(qs.length, vs.length, prodStr.length, String(D).length, partials ? partials[1].length + 1 : 0, partials ? partials[0].length : 0) + 1;
  const items = [], cells = [], acts = [], hl = [];
  const given = (row, str, right) => { for (let j = 0; j < str.length; j++) items.push({ r: row, c: right - str.length + 1 + j, t: str[j] }); };
  const input = (row, str, right, label, hint) => {
    const ids = [];
    for (let j = str.length - 1; j >= 0; j--) {
      const c = right - str.length + 1 + j, id = `p${row}_${c}`;
      cells.push({ id, kind: 'prova', val: +str[j], r: row, c });
      ids.push(id);
    }
    acts.push({ kind: 'prova', ids, label, hint });
  };
  given(0, qs, W - 1); items.push({ r: 1, c: 0, t: '×' }); given(1, vs, W - 1); hl.push({ r: 1, c1: 0, c2: W - 1 });
  let r;
  if (partials) {
    input(2, partials[0], W - 1, 'Moltiplico', `${Q} × ${v % 10} (le unità)`);
    input(3, partials[1], W - 2, 'Moltiplico', `${Q} × ${Math.floor(v / 10)} (le decine): scrivi spostandoti di un posto a sinistra`);
    items.push({ r: 3, c: W - 1, t: '–', faint: true });
    items.push({ r: 3, c: 0, t: '+' });
    hl.push({ r: 3, c1: 0, c2: W - 1 });
    input(4, prodStr, W - 1, 'Sommo', 'Somma i due risultati in colonna');
    r = 4;
  } else {
    input(2, prodStr, W - 1, 'Moltiplico', `${Q} × ${v} = ? (in colonna, da destra)`);
    r = 2;
  }
  if (R > 0) {
    items.push({ r: r + 1, c: 0, t: '+' }); given(r + 1, String(R), W - 1); hl.push({ r: r + 1, c1: 0, c2: W - 1 });
    input(r + 2, String(D), W - 1, 'Aggiungo il resto', `${Q * v} + ${R} = ?`);
    r += 2;
  }
  return { cols: W, rows: r + 1, items, hl, vl: [], cells, acts };
}

function generate(s) {
  const n = s.dividendDigits, lo = 10 ** (n - 1), hi = 10 ** n - 1;
  const wantR = s.remainder === 'sempre' ? true : s.remainder === 'mai' ? false : Math.random() < 0.5;
  const wantZero = s.zero && Math.random() < 0.5;
  const divs = (s.divisors && s.divisors.length) ? s.divisors : [2, 3, 4, 5, 6, 7, 8, 9];
  for (let t = 0; t < 5000; t++) {
    const v = s.divisorType === 'due' ? rnd(11, 29) : pick(divs);
    let D;
    if (!wantR) {
      const qlo = Math.ceil(lo / v), qhi = Math.floor(hi / v);
      if (qlo > qhi) continue;
      D = v * rnd(qlo, qhi);
    } else D = rnd(lo, hi);
    if (D < v) continue;
    if (wantR !== (D % v > 0)) continue;
    const sol = solveDiv(D, v, 'lungo'), hasZero = sol.qd.includes(0);
    if (!s.zero && hasZero) continue;
    if (wantZero && !hasZero && t < 4000) continue;
    if (sol.Q < 2 && t < 4500) continue;
    return { D, v };
  }
  return { D: 84, v: 4 };
}

function actInfo(a, sol) {
  if (a.kind === 'prova') return [a.label, a.hint];
  const s = sol.steps[a.step], v = sol.v;
  switch (a.kind) {
    case 'q': return ['Divido', `Quante volte il ${v} sta nel ${s.p}?`];
    case 'prod': return ['Moltiplico', `${s.q} × ${v} = ?`];
    case 'rem': return sol.method === 'lungo' ? ['Sottraggo', `${s.p} − ${s.prod} = ?`] : ['Sottraggo', `${s.p} − (${s.q} × ${v}) = ?  Fai il calcolo a mente e scrivi il resto`];
    case 'down': return ['Abbasso', 'Abbasso la cifra successiva del dividendo'];
  }
  return ['', ''];
}

function errType(cell, d) {
  switch (cell.kind) {
    case 'q': return cell.val === 0 ? 'zero' : (d > cell.val ? 'qAlto' : 'qBasso');
    case 'prod': return 'tab';
    case 'rem': return 'sott';
    case 'down': return 'abb';
    default: return 'prova';
  }
}
/* ================= ENGINE END ================= */

const ERR_LABELS = { qAlto: 'Quoziente troppo alto', qBasso: 'Quoziente troppo basso', zero: 'Zero nel quoziente dimenticato', tab: 'Moltiplicazione (tabelline)', sott: 'Sottrazione / resto', abb: 'Cifra abbassata sbagliata', prova: 'Errori nella prova' };

/* ================= STORAGE ================= */
const DB_KEY = 'dividivino_v1';
const DEF_SETTINGS = { method: 'lungo', guide: 'alta', errorMode: 'rosso', proof: false, toolPit: true, toolTab: true, tabMode: 'scelta',
  dividendDigits: 2, divisorType: 'uno', divisors: [2, 3, 4, 5], remainder: 'mai', zero: false,
  dailyGoal: 5, warmup: true, stories: true, easyRead: false, rewardStars: 20, rewardText: 'Un premio a sorpresa' };
const PRESETS = {
  1: { dividendDigits: 2, divisorType: 'uno', divisors: [2, 3, 4, 5], remainder: 'mai', zero: false },
  2: { dividendDigits: 3, divisorType: 'uno', divisors: [2, 3, 4, 5, 6, 7, 8, 9], remainder: 'avolte', zero: false },
  3: { dividendDigits: 3, divisorType: 'uno', divisors: [2, 3, 4, 5, 6, 7, 8, 9], remainder: 'avolte', zero: true },
  4: { dividendDigits: 3, divisorType: 'due', divisors: [2, 3, 4, 5, 6, 7, 8, 9], remainder: 'avolte', zero: true }
};

const stu = id => DB.students.find(s => s.id === id);
async function hashStr(p) {
  const s = 'dividivino:' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'f' + h; }
}

function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function modal({ title, body = '', buttons = [{ label: 'OK', cls: 'pri' }], onOpen }) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal-bg';
    m.innerHTML = `<div class="modal"><h2>${title}</h2><div class="mb">${body}</div><div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(m);
    m.querySelectorAll('[data-i]').forEach(el => el.onclick = () => {
      const b = buttons[+el.dataset.i];
      const out = b.collect ? b.collect(m) : (b.value !== undefined ? b.value : +el.dataset.i);
      if (b.keepOpen && b.keepOpen(out, m)) return;
      m.remove(); res(out);
    });
    if (onOpen) onOpen(m);
  });
}

/* ---- stats ---- */
function streak(s) {
  let n = 0; const d = new Date();
  if (!s.stats.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (s.stats.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function statsView() {
  const s = stu(V.sid), h = s.stats.history, N = h.length;
  const perfect = h.filter(x => x.perfect).length;
  const avgT = N ? Math.round(h.reduce((a, x) => a + x.ms, 0) / N / 1000) : 0;
  const withTool = h.filter(x => x.tools && (x.tools.pit || x.tools.tab)).length;
  const proofs = h.filter(x => x.proof);
  const errs = s.stats.errors, maxE = Math.max(1, ...Object.values(errs));
  const tabs = Object.entries(s.stats.tables).map(([k, o]) => ({ k, ...o, rate: o.ko / (o.ok + o.ko) })).filter(x => x.ko > 0).sort((a, b) => b.rate - a.rate || b.ko - a.ko).slice(0, 8);
  const days = []; const d = new Date(); d.setDate(d.getDate() - 13);

let CUR = null; // current exercise

function afterDivRender() { renderSheet(); }
function sheetHTML(S) {
  const sh = S.sh, st = stu(CUR.sid).settings, mode = st.errorMode, guide = st.guide;
  const curAct = S.done ? null : sh.acts.find(a => a.ids.some(id => !cellDone(S, sh.cells.find(c => c.id === id))));
  const curIds = new Set(guide !== 'nessuna' && curAct ? curAct.ids : []);
  let h = `<div class="sheet" style="grid-template-columns:repeat(${sh.cols + 2},var(--c));grid-template-rows:repeat(${sh.rows + 3},var(--c))">`;
  for (const it of sh.items) h += `<div class="g ${it.faint ? 'faint' : ''}" style="grid-row:${it.r + 2};grid-column:${it.c + 2}">${esc(it.t)}</div>`;
  for (const l of sh.hl) h += `<div class="hl" style="grid-row:${l.r + 2};grid-column:${l.c1 + 2}/${l.c2 + 3}"></div>`;
  for (const l of sh.vl) h += `<div class="vl" style="grid-row:${l.r1 + 2}/${l.r2 + 3};grid-column:${l.c + 2}"></div>`;
  for (const c of sh.cells) {
    const v = S.values[c.id];
    const cls = ['in', curIds.has(c.id) ? 'cur' : '', S.sel === c.id ? 'sel' : '', mode !== 'fine' && S.wrong[c.id] ? 'bad' : ''].join(' ');
    h += `<button class="${cls}" data-id="${c.id}" style="grid-row:${c.r + 2};grid-column:${c.c + 2}">${v ?? ''}</button>`;
  }
  return { html: h + '</div>', curAct };
}
function renderSheet() {
  const S = CUR.S, st = stu(CUR.sid).settings;
  S.sh.errMode = st.errorMode;

  const paper = $('#paper'); paper.innerHTML = html;

  // step bar
  let sb = '';
  if (S.done) sb = `<span class="hint">${CUR.phase === 'proof' ? 'Prova completata!' : 'Divisione completata!'}</span>`;
  else if (st.guide !== 'nessuna' && curAct) {
    const [lab, hint] = actInfo(curAct, CUR.sol);
    const names = CUR.phase === 'proof' ? [] : (st.method === 'lungo' ? ['Divido', 'Moltiplico', 'Sottraggo', 'Abbasso'] : ['Divido', 'Sottraggo', 'Abbasso']);
    sb = (names.length ? `<div class="stepchips">${names.map(n => `<span class="chip ${n === lab ? 'on' : ''}">${n}</span>`).join('')}</div>` : `<span class="chip on">${lab}</span>`)
      + (st.guide === 'alta' ? `<span class="hint">${esc(hint)}</span>` : '');
  } else sb = `<span class="hint mut">${CUR.phase === 'proof' ? 'Fai la prova: quoziente × divisore + resto' : 'Esegui la divisione'}</span>`;
  $('#stepbar').innerHTML = `<div class="stepbar">${sb}</div>`;
  // messages / actions
  let mb = '';
  if (S.msg) mb += `<div class="msg ${S.msg[0]}">${S.msg[1]}</div>`;
  if (!S.done && st.errorMode === 'fine') {
    const all = S.sh.cells.every(c => S.values[c.id] != null);
    mb += `<p><button class="btn pri big" ${all ? '' : 'disabled'} onclick="checkFine()">✅ Ho finito</button></p>`;
  }
  if (S.done) mb += doneActions();
  $('#msgbox').innerHTML = mb;
  const sel = paper.querySelector('.sel'); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function logErr(S, cell, d) {
  if (S.logged[cell.id]) return;
  const t = errType(cell, d); S.logged[cell.id] = t;
  CUR.errors[t] = (CUR.errors[t] || 0) + 1;
}
function nextSel(S) {
  const i = S.order.indexOf(S.sel), cells = S.sh.cells, f = id => cellDone(S, cells.find(c => c.id === id));
  for (let k = 1; k <= S.order.length; k++) { const id = S.order[(i + k) % S.order.length]; if (!f(id)) return id; }
  return null;
}
function press(d) {
  const S = CUR && CUR.S; if (!S || S.done) return;
  const st = stu(CUR.sid).settings, mode = st.errorMode;
  if (d === 'next') { const i = S.order.indexOf(S.sel); S.sel = S.order[(i + 1) % S.order.length]; return renderSheet(); }
  if (!S.sel) return;
  const cell = S.sh.cells.find(c => c.id === S.sel);
  if (d === 'del') { delete S.values[cell.id]; delete S.wrong[cell.id]; S.msg = null; return renderSheet(); }
  S.msg = null;
  if (mode === 'blocco') {
    if (d !== cell.val) {
      logErr(S, cell, d); renderSheet();
      const el = $(`.in[data-id="${cell.id}"]`); if (el) { el.classList.add('bad', 'sh'); el.textContent = d; setTimeout(() => { el.classList.remove('bad', 'sh'); el.textContent = ''; }, 450); }
      return;
    }
    S.values[cell.id] = d;
  } else if (mode === 'rosso') {
    S.values[cell.id] = d;
    if (d !== cell.val) { logErr(S, cell, d); S.wrong[cell.id] = true; } else delete S.wrong[cell.id];
  } else S.values[cell.id] = d;
  S.sel = nextSel(S) || S.sel;
  if (mode !== 'fine' && S.sh.cells.every(c => S.values[c.id] === c.val)) return complete();
  if (mode === 'rosso' && S.sh.cells.every(c => S.values[c.id] != null) && Object.keys(S.wrong).length) {
    S.msg = ['ko', 'Ci sono cifre rosse da correggere: toccale e riscrivile.'];
    S.sel = S.order.find(id => S.wrong[id]);
  }
  renderSheet();
}
function checkFine() {
  const S = CUR.S, bad = S.sh.cells.filter(c => S.values[c.id] !== c.val);
  if (!bad.length) return complete();
  bad.forEach(c => logErr(S, c, S.values[c.id]));
  S.msg = ['ko', CUR.phase === 'proof' ? '🤔 Nella prova c\'è un errore: ricontrolla i calcoli!' : '🤔 C\'è almeno un errore: rivedi la divisione!'];
  renderSheet();
}
function complete() {
  const S = CUR.S, s = stu(CUR.sid); S.done = true; S.sel = null;
  if (CUR.phase === 'div') {
    const perfect = Object.keys(CUR.errors).length === 0, sol = CUR.sol;
    const rec = { t: Date.now(), D: sol.D, v: sol.v, Q: sol.Q, R: sol.R, method: sol.method, ms: Date.now() - CUR.start, errors: Object.assign({}, CUR.errors), perfect, tools: CUR.tools, proof: null };
    s.stats.history.push(rec); if (s.stats.history.length > 2000) s.stats.history.shift();
    CUR.rec = rec;
    for (const [k, n] of Object.entries(CUR.errors)) s.stats.errors[k] = (s.stats.errors[k] || 0) + n;
    // tabelline
    if (sol.v <= 10) sol.steps.forEach((stp, k) => {
      if (stp.q === 0) return;
      const key = `${stp.q} × ${sol.v}`, kinds = sol.method === 'lungo' ? ['prod'] : ['rem'];
      const ko = S.sh.cells.some(c => c.step === k && kinds.includes(c.kind) && S.logged[c.id]);
      const o = s.stats.tables[key] || (s.stats.tables[key] = { ok: 0, ko: 0 }); ko ? o.ko++ : o.ok++;
    });
    const dk = dayKey(); s.stats.days[dk] = (s.stats.days[dk] || 0) + 1;
    const earned = 1 + (perfect ? 1 : 0); addStars(s, earned);
    const goalHit = s.stats.days[dk] === s.settings.dailyGoal;
    S.msg = ['ok', `🎉 Bravo! ${sol.D} : ${sol.v} = <b>${sol.Q}</b>${sol.R ? ` con resto <b>${sol.R}</b>` : ''}. ${perfect ? 'Senza errori! ' : ''}+${earned} ⭐${goalHit ? '<br>🏆 Obiettivo di oggi raggiunto!' : ''}`];
    save(); confetti();
  } else {
    const ok = !Object.keys(S.logged).length;
    CUR.rec.proof = ok ? 'ok' : 'ko';
    const pe = Object.keys(S.logged).length;
    if (pe) s.stats.errors.prova = (s.stats.errors.prova || 0) + pe;
    addStars(s, 1);
    S.msg = ['ok', `✔ Il risultato è <b>${CUR.sol.D}</b>, uguale al dividendo: la divisione è giusta! +1 ⭐`];
    save(); confetti();
  }
  render();
}
function addStars(s, n) { s.stats.stars += n; s.stats.rewardStars += n; }
function doneActions() {
  const st = stu(CUR.sid).settings;
  if (CUR.phase === 'div' && st.proof) return `<p class="row"><button class="btn grn big" onclick="startProof()">🔍 Fai la prova</button></p>`;
  return `<p class="row">${CUR.phase === 'div' ? `<button class="btn grn" onclick="startProof()">🔍 Fai la prova</button>` : ''}
    <button class="btn pri big" onclick="startDiv()">➗ Nuova divisione</button><button class="btn" onclick="CUR=null;go('student',{sid:V.sid})">Basta per ora</button></p>`;
}
async function leaveDiv() {
  if (CUR && !CUR.S.done && Object.keys(CUR.S.values).length) {
    if (!await confirmBox('Vuoi uscire?', 'La divisione non è finita e non verrà salvata.', 'Esci', 'pri')) return;
  }
  if (CUR && CUR.phase === 'proof' && !CUR.S.done && stu(CUR.sid).settings.proof) { /* prova abbandonata */ }
  CUR = null; go('student', { sid: V.sid });
}

/* ================= TOOLS ================= */
function openTool(t) {
  TOOLS.open = t; if (CUR) CUR.tools[t]++;
  drawTools();
}
function drawTools() {
  let el = $('#toolsLayer'); if (!el) { el = document.createElement('div'); el.id = 'toolsLayer'; document.body.appendChild(el); }
  if (!TOOLS.open) { el.innerHTML = ''; return; }
  const st = CUR ? stu(CUR.sid).settings : DEF_SETTINGS, t = TOOLS.open;
  let grid = '';
  if (t === 'pit') {
    for (let i = 1; i <= 10; i++) for (let j = 1; j <= 10; j++) { const k = i + '-' + j; grid += `<button class="${TOOLS.pit.has(k) ? 'on' : (i === 1 || j === 1 ? 'h1' : '')}" onclick="toolTap('pit','${k}')">${i * j}</button>`; }
  } else {
    for (let n = 0; n < 100; n++) grid += `<button class="${TOOLS.tab.has(n) ? 'on' : ''}" onclick="toolTap('tab',${n})">${n}</button>`;
  }
  el.innerHTML = `<div class="tools-bg" onclick="if(event.target===this){TOOLS.open=null;drawTools()}"><div class="tools">
    <div class="row"><div class="seg">${st.toolPit ? `<button class="${t === 'pit' ? 'on' : ''}" onclick="TOOLS.open='pit';drawTools()">Tavola pitagorica</button>` : ''}${st.toolTab ? `<button class="${t === 'tab' ? 'on' : ''}" onclick="TOOLS.open='tab';drawTools()">Tabella 0–99</button>` : ''}</div><span class="sp"></span>
    <button class="btn ghost" onclick="TOOLS.open=null;drawTools()">✕</button></div>
    ${t === 'tab' && st.tabMode === 'multipli' ? '<div class="help">Tocca un numero per vedere i suoi multipli.</div>' : ''}
    <div class="ttab">${grid}</div>
    <button class="btn acc" style="width:100%" onclick="toolClear()">🧽 Togli tutte le evidenziazioni</button></div></div>`;
}
function toolTap(t, k) {
  const st = CUR ? stu(CUR.sid).settings : DEF_SETTINGS;
  if (t === 'pit') { TOOLS.pit.has(k) ? TOOLS.pit.delete(k) : TOOLS.pit.add(k); }
  else if (st.tabMode === 'multipli') {
    if (k === 0) return;
    if (TOOLS.base === k) { TOOLS.tab.clear(); TOOLS.base = null; }
    else { TOOLS.tab.clear(); for (let m = k; m < 100; m += k) TOOLS.tab.add(m); TOOLS.base = k; }
  } else { TOOLS.tab.has(k) ? TOOLS.tab.delete(k) : TOOLS.tab.add(k); }
  drawTools();
}
function toolClear() { if (TOOLS.open === 'pit') TOOLS.pit.clear(); else { TOOLS.tab.clear(); TOOLS.base = null; } drawTools(); }

/* ================= WARM-UP ================= */
let W = null;
function startWarm() {
  const s = stu(V.sid), st = s.settings;
  const base = st.divisorType === 'uno' ? st.divisors : [2, 3, 4, 5, 6, 7, 8, 9];
  W = { sid: s.id, base, left: 60, correct: 0, total: 0, ans: '', q: null, fb: null, over: false };
  newWarmQ(); go('warm', { sid: s.id });
  warmTimer = setInterval(() => { W.left--; if (W.left <= 0) endWarm(); else { const t = $('#wt'); if (t) t.textContent = W.left; } }, 1000);
}
function newWarmQ() { W.q = [rnd(1, 10), pick(W.base)]; W.ans = ''; }
function warmView() {
  if (!W) return studentView();
  if (W.over) return `<div class="card" style="text-align:center;max-width:480px;margin:20px auto">${mascotSVG()}<h1>Tempo scaduto!</h1>
    <p style="font-size:1.4rem">Hai risposto giusto a <b>${W.correct}</b> su <b>${W.total}</b></p>${W.correct >= 8 ? '<p>Fantastico! +1 ⭐</p>' : ''}
    <div class="grid"><button class="btn pri big" onclick="startDiv()">➗ Ora una divisione!</button><button class="btn" onclick="go('student',{sid:V.sid})">Torna indietro</button></div></div>`;
  return `<div class="topbar"><button class="btn ghost" onclick="W=null;go('student',{sid:V.sid})">← Esci</button><span class="sp"></span><span class="pill">⏱️ <span id="wt">${W.left}</span>s</span><span class="pill">✔ ${W.correct}</span></div>
  <div style="max-width:420px;margin:0 auto" class="grid">
    <div class="warm-q">${W.q[0]} × ${W.q[1]} = ?</div>
    <div class="warm-a" style="${W.fb === 'ok' ? 'background:#DDF7EA' : W.fb ? 'background:#FFE7E8' : ''}">${W.fb && W.fb !== 'ok' ? `<span style="color:var(--red)">${W.fb}</span>` : esc(W.ans) || '&nbsp;'}</div>
    <div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button onclick="warmKey('${d}')">${d}</button>`).join('')}<button class="ctl" onclick="warmKey('del')">⌫</button><button onclick="warmKey('0')">0</button><button class="ctl" style="background:var(--grn);color:#fff" onclick="warmKey('ok')">OK</button></div>
  </div>`;
}
function warmKey(k) {
  if (!W || W.over || W.fb) return;
  if (k === 'del') W.ans = W.ans.slice(0, -1);
  else if (k === 'ok') {
    if (!W.ans) return;
    const [a, b] = W.q, ok = +W.ans === a * b, s = stu(W.sid), key = `${a} × ${b}`;
    const o = s.stats.tables[key] || (s.stats.tables[key] = { ok: 0, ko: 0 }); ok ? o.ok++ : o.ko++;
    W.total++; if (ok) W.correct++;
    W.fb = ok ? 'ok' : `${a} × ${b} = ${a * b}`;
    render();
    setTimeout(() => { if (!W || W.over) return; W.fb = null; newWarmQ(); render(); }, ok ? 350 : 1400);
    return;
  } else if (W.ans.length < 3) W.ans += k;
  render();
}
function endWarm() {
  clearInterval(warmTimer); warmTimer = null;
  const s = stu(W.sid); W.over = true;
  s.stats.warmups.push({ t: Date.now(), correct: W.correct, total: W.total }); if (s.stats.warmups.length > 200) s.stats.warmups.shift();
  if (W.correct >= 8) { addStars(s, 1); confetti(); }
  save(); render();
}

/* ================= INIT ================= */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
</body>
